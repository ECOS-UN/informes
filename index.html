<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente - ECOS</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 1. IMAGEN DE FONDO CON CAPA OSCURA */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* REEMPLAZA ESTA URL POR TU IMAGEN DE FONDO */
      background: url('SalonPolivalente.webp') no-repeat center center/cover;
      filter: brightness(0.4) blur(3px); /* Oscurece y desenfoca ligeramente el fondo */
      transform: scale(1.05); /* Evita bordes blancos por el blur */
      z-index: 1;
    }

    /* 2. TARJETA CONTENEDORA EN EL CENTRO */
    .hero-container {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 50px 35px;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 650px;
      width: 90%;
    }

    /* 3. LOGOTIPO ECOS */
    .logo-container {
      margin-bottom: 25px;
    }

    .logo-container img {
      max-width: 220px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    p.subtext {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 35px;
    }

    /* 4. TABLERO DE CUENTA REGRESIVA (DÍAS, HORAS, MINUTOS, SEGUNDOS) */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .time-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px 8px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease;
    }

    .time-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.12);
    }

    .time-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #38bdf8; /* Azul cyan brillante */
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .time-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 8px;
      font-weight: 600;
    }

    /* MENSAJE CUANDO INICIE EL EVENTO */
    .started-message {
      display: none;
      font-size: 1.6rem;
      font-weight: bold;
      color: #4ade80;
    }

    /* Responsivo para celulares pequeños */
    @media (max-width: 480px) {
      .countdown-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .time-number {
        font-size: 2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- FONDO CON IMAGEN -->
  <div class="bg-image"></div>

  <!-- CONTENIDO CENTRAL -->
  <div class="hero-container">
    
    <!-- LOGO DE ECOS -->
    <div class="logo-container">
      <!-- REEMPLAZA ESTA URL POR LA DE TU LOGOTIPO -->
      <img src="LogoECOS.png" alt="Logo ECOS">
    </div>

    <h1>El evento está por comenzar</h1>
    <p class="subtext">Falta muy poco para dar inicio a las evaluaciones de ECOS.</p>

    <!-- CUENTA REGRESIVA -->
    <div class="countdown-grid" id="countdownGrid">
      <div class="time-card">
        <div class="time-number" id="days">00</div>
        <div class="time-label">Días</div>
      </div>
      <div class="time-card">
        <div class="time-number" id="hours">00</div>
        <div class="time-label">Horas</div>
      </div>
      <div class="time-card">
        <div class="time-number" id="minutes">00</div>
        <div class="time-label">Min</div>
      </div>
      <div class="time-card">
        <div class="time-number" id="seconds">00</div>
        <div class="time-label">Seg</div>
      </div>
    </div>

    <!-- MENSAJE AUTOMÁTICO AL INICIAR -->
    <div class="started-message" id="startedMsg">
      🚀 ¡El evento ha comenzado!
    </div>

  </div>

  <script>
    // ===================================================
    // CONFIGURACIÓN DE FECHA Y HORA DEL EVENTO (CDMX)
    // Formato: AAAA-MM-DDTHH:mm:ss-06:00
    // Ejemplo: 30 de Julio de 2026 a las 06:00 PM CDMX
    // ===================================================
    const TARGET_DATE_STRING = "2026-07-30T18:00:00-06:00"; 
    
    const targetDate = new Date(TARGET_DATE_STRING).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("countdownGrid").style.display = "none";
        document.getElementById("startedMsg").style.display = "block";
        return;
      }

      // Cálculos de Días, Horas, Minutos y Segundos
      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      // Formato de dos dígitos
      document.getElementById("days").textContent = String(days).padStart(2, '0');
      document.getElementById("hours").textContent = String(hours).padStart(2, '0');
      document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
      document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
